<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Subscription Form with Google Sheet</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="hero">
        <h3>Coming Soon!</h3>
        <h1>Our Brand New <br> Website Is On It's Way</h1>
        <p>Subscribe for more details</p>

        <form name="submit-to-google-sheet">
            <input type="email" name="Email" placeholder="Your Email id" required>
            <button type="submit"><img src="email-subs-img/send-icon.png" width="30px"></button>
            <div class="loader" id="loader"></div>
        </form>

        <span id="msg"></span>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbztPkQW7qxkNv1rYPy_DiDIm18yBaZqXdJLSWrMXpuMRPj_SRSIAcJbaPSWhHLWX6VQ/exec';
        const form = document.forms['submit-to-google-sheet'];
        const msg = document.getElementById("msg");

        form.addEventListener('submit', e => {
            e.preventDefault()
            const loader = document.getElementById("loader");
            loader.style.display = "inline-block"; // Show loader
            fetch(scriptURL, { method: 'POST', body: new FormData(form) })
                .then(response => {
                    loader.style.display = "none"; // Hide loader
                    msg.innerHTML = "Thank You For Subscribing! 🎉";
                    msg.classList.add('show');
                    setTimeout(function () {
                        msg.innerHTML = "";
                        msg.classList.remove('show');
                    }, 5000);
                    form.reset();
                })
                .catch(error => {
                    loader.style.display = "none"; // Hide loader
                    console.error('Error!', error.message)
                })
        })
    </script>

</body>

</html>
